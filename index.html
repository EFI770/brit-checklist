<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הברית שלנו">
<meta name="theme-color" content="#123e35">
<title>הברית שלנו | צ׳קליסט מלא</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f5ee;--card:#fff;--text:#1c302b;--muted:#58766a;
  --primary:#123e35;--accent:#d6bd74;--border:#e0e6de;
  --success:#1b7259;--warn-bg:#fff9e8;--warn-border:#ecdda8;
}
body.dark{
  --bg:#0f1a17;--card:#1a2a25;--text:#e8f0ed;--muted:#8aa399;
  --primary:#1a4a3e;--accent:#c9a84c;--border:#2a3d36;
  --success:#2d9b7a;--warn-bg:#2a2418;--warn-border:#5c4d2a;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Arial',sans-serif;transition:background .3s,color .3s}
header{background:var(--primary);color:white;padding:28px 18px 22px;border-radius:0 0 28px 28px;position:relative}
h1{font-size:28px;margin:0 0 4px}
header p{margin:0;color:#d5e6de;font-size:14px}
.progress{margin-top:20px;display:flex;justify-content:space-between;align-items:center}
.percent{font-size:34px;font-weight:800}
.bar{height:10px;background:#41665c;border-radius:20px;overflow:hidden;margin-top:10px}
.fill{height:100%;background:var(--accent);width:0;transition:width .3s}
main{padding:14px 12px 50px;max-width:720px;margin:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.toolbar button,button.sec-btn{
  font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card);
  border-radius:12px;padding:10px 12px;color:var(--text);font-size:14px
}
.toolbar button:active{opacity:.8}
.section{background:var(--card);border:1px solid var(--border);border-radius:16px;margin:10px 0;overflow:hidden}
.section summary{
  padding:16px 14px;font-size:16px;font-weight:700;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;list-style:none;gap:8px
}
.section summary::-webkit-details-marker{display:none}
.count{font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
.tasks{padding:0 12px 12px}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:15px;line-height:1.4}
.task input{width:22px;height:22px;flex:none;accent-color:var(--success);margin:1px 0 0}
.task:has(input:checked) span{text-decoration:line-through;color:var(--muted)}
.task .del{margin-right:auto;background:none;border:none;color:#c45c5c;font-size:18px;padding:0 4px;cursor:pointer;opacity:.6}
.custom-input{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.custom-input input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font:inherit;background:var(--bg);color:var(--text)}
.custom-input button{padding:10px 14px;background:var(--primary);color:white;border:none;border-radius:10px}
.notice{padding:13px;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:14px;line-height:1.55;font-size:13.5px;margin:16px 0}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:10px}
.theme-btn{position:absolute;top:18px;left:16px;background:rgba(255,255,255,.15);border:none;color:white;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:99;display:none}
.celebrate.show{display:block}
.confetti{position:absolute;width:10px;height:10px;border-radius:2px;animation:fall 2.5s ease-out forwards}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}
.sec-actions{display:flex;gap:6px;margin-bottom:6px}
.sec-actions button{font-size:12px;padding:6px 10px}
</style>
</head>
<body>
<header>
  <button class="theme-btn" onclick="toggleTheme()" title="מצב כהה/בהיר">🌓</button>
  <h1>הברית שלנו ✨</h1>
  <p>צ׳קליסט מלא להכנות לברית (חב״ד + כללי)</p>
  <div class="progress">
    <div>
      <div class="percent" id="percent">0%</div>
      <small id="fraction">0 משימות הושלמו</small>
    </div>
    <div style="font-size:42px">✡</div>
  </div>
  <div class="bar"><div class="fill" id="fill"></div></div>
</header>

<main>
  <div class="toolbar">
    <button onclick="expandAll(true)">פתח הכל</button>
    <button onclick="expandAll(false)">סגור הכל</button>
    <button onclick="share()">שיתוף</button>
    <button onclick="printList()">הדפסה</button>
    <button onclick="resetAll()" style="color:#c45c5c">איפוס</button>
  </div>

  <div id="sections"></div>

  <div class="notice">
    <strong>חשוב:</strong> הרשימה מבוססת על מנהגי חב״ד וניסיון מעשי. תמיד להתייעץ עם המוהל והרופא שלכם.  
    אפשר להוסיף משימות אישיות בכל קטגוריה.
  </div>
  <div class="footer">שמור למסך הבית · עובד גם ללא אינטרנט · גרסה 2.0</div>
</main>

<div class="celebrate" id="celebrate"></div>

<script>
const data = [
  ['מיד אחרי הלידה', [
    'יצירת קשר עם מוהל מוסמך (רשיון משרד הבריאות)',
    'קבלת המלצות על מוהל מנוסה',
    'תיאום מועד ראשוני עם המוהל (יום השמיני)',
    'בדיקת מצב רפואי של התינוק עם הרופא',
    'בחירת סנדק (ואישור שלו)',
    'החלטה על מקום הברית (בית כנסת / אולם / בית)'
  ]],
  ['ציוד לברית (חובה)', [
    '4 חיתולי בד נקיים',
    '3–4 טיטולים',
    'מגבונים לחים',
    'מוצץ',
    'כרית לברית (או כרית רגילה רכה)',
    '2 טליתות (לאבא ולסנדק)',
    'יין אדום כשר (לא מקורר) + גביע',
    'משחת אלחוש (עזרקאין / אמלה) לפי הנחיית המוהל',
    'משחת ריפוי (בפנטן פלוס / ויטה מורפן)',
    'שמן תינוקות / שמן שקדים',
    'אקמול / נובימול לתינוקות (סירופ או נרות)',
    'בגדים חלופיים לתינוק',
    'ערכת כלים סטרילית (אם המוהל מבקש)'
  ]],
  ['הזמנות ואורחים', [
    'הכנת רשימת מוזמנים',
    'הזמנת אורחים (טלפון / וואטסאפ / הזמנה מודפסת)',
    'הזמנת קייטרינג או כיבוד (עוגות, פירות, שתייה)',
    'הזמנת צלם / וידאו / שידור חי',
    'הזמנת כלי נגינה / חזן / מנגינות (אם רוצים)',
    'הדפסת תשורות / חוברות / הזמנות',
    'מינוי אחראי לחלוקת תשורות'
  ]],
  ['הכנות לוגיסטיות', [
    'וידוא זמינות כיסא אליהו במקום',
    'תיאום עם הגבאי / בעל האולם על שעות',
    'הכנת רשימת כיבודים (מי קורא, מי מחזיק וכו\')',
    'בחירת בגדים ליולדת ולאחים',
    'הכנת תיק עם כל הציוד לברית',
    'סידור הסעה / חניה לאורחים אם צריך'
  ]],
  ['יום לפני הברית', [
    'וידוא אישור רפואי סופי מהרופא',
    'קביעת שעה מדויקת עם המוהל',
    'רחיצת התינוק (אחרי הברית קשה יותר)',
    'האכלה אחרונה לפי הנחיות המוהל (בדרך כלל עד 30–60 דק\' לפני)',
    'בדיקה שכל הציוד מוכן בתיק',
    'אישור עם הסנדק והאורחים הקרובים',
    'הכנת הבגדים והטליתות'
  ]],
  ['ביום הברית', [
    'קבלת אישור סופי שהמצב הרפואי מאפשר',
    'וידוא הגעת המוהל והסנדק',
    'הכנת התינוק לפי הנחיות המוהל',
    'הבאת כל הציוד, היין והגביע',
    'סידור כיסא אליהו ומקום הברית',
    'חלוקת הכיבודים',
    'צילום ותיעוד',
    'חלוקת התשורות',
    'לימוד / התוועדות בסעודה (מנהג חב״ד)',
    'קבלת הנחיות כתובות לטיפול לאחר הברית',
    'קביעת ביקורת ומעקב עם המוהל'
  ]],
  ['אחרי הברית', [
    'מעקב אחרי הטמפרטורה של התינוק',
    'בדיקת מתן שתן (תוך 5–6 שעות)',
    'מריחת משחה לפי הנחיות',
    'החלפת חיתול בעדינות',
    'יצירת קשר עם המוהל בכל שאלה',
    'מנוחה ליולדת ולתינוק'
  ]]
];

const key = 'bris-checklist-v2';
let state = {};
let custom = {};

try {
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  state = saved.state || {};
  custom = saved.custom || {};
} catch(e) {}

function save() {
  localStorage.setItem(key, JSON.stringify({state, custom}));
  update();
}

function update() {
  let total = 0, done = 0;
  data.forEach((s, i) => {
    let count = 0;
    const allTasks = [...s[1], ...(custom[i] || [])];
    allTasks.forEach((t, j) => {
      total++;
      if (state[i + '-' + j]) { done++; count++; }
    });
    const el = document.getElementById('count-' + i);
    if (el) el.textContent = count + '/' + allTasks.length;
  });
  const p = total ? Math.round(100 * done / total) : 0;
  document.getElementById('percent').textContent = p + '%';
  document.getElementById('fraction').textContent = done + ' מתוך ' + total + ' משימות הושלמו';
  document.getElementById('fill').style.width = p + '%';
  if (p === 100 && total > 0) celebrate();
}

function render() {
  const root = document.getElementById('sections');
  root.innerHTML = '';
  data.forEach((s, i) => {
    const details = document.createElement('details');
    details.className = 'section';
    details.open = i < 2;
    details.id = 'sec-' + i;

    const summary = document.createElement('summary');
    const name = document.createElement('span');
    name.textContent = (i + 1) + '. ' + s[0];
    const count = document.createElement('span');
    count.className = 'count';
    count.id = 'count-' + i;
    summary.append(name, count);
    details.append(summary);

    const tasksDiv = document.createElement('div');
    tasksDiv.className = 'tasks';

    const actions = document.createElement('div');
    actions.className = 'sec-actions';
    const markAll = document.createElement('button');
    markAll.className = 'sec-btn';
    markAll.textContent = 'סמן הכל';
    markAll.onclick = (e) => { e.preventDefault(); toggleSection(i, true); };
    const unmarkAll = document.createElement('button');
    unmarkAll.className = 'sec-btn';
    unmarkAll.textContent = 'בטל הכל';
    unmarkAll.onclick = (e) => { e.preventDefault(); toggleSection(i, false); };
    actions.append(markAll, unmarkAll);
    tasksDiv.append(actions);

    const allTasks = [...s[1], ...(custom[i] || [])];
    allTasks.forEach((t, j) => {
      const isCustom = j >= s[1].length;
      const label = document.createElement('label');
      label.className = 'task';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!state[i + '-' + j];
      cb.onchange = () => {
        state[i + '-' + j] = cb.checked;
        save();
      };
      const span = document.createElement('span');
      span.textContent = t;
      label.append(cb, span);
      if (isCustom) {
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '×';
        del.title = 'מחק משימה';
        del.onclick = (e) => {
          e.preventDefault();
          deleteCustom(i, j - s[1].length);
        };
        label.append(del);
      }
      tasksDiv.append(label);
    });

    const addDiv = document.createElement('div');
    addDiv.className = 'custom-input';
    const inp = document.createElement('input');
    inp.placeholder = 'הוסף משימה אישית...';
    inp.id = 'inp-' + i;
    const addBtn = document.createElement('button');
    addBtn.textContent = '+';
    addBtn.onclick = () => addCustom(i);
    inp.onkeydown = (e) => { if (e.key === 'Enter') addCustom(i); };
    addDiv.append(inp, addBtn);
    tasksDiv.append(addDiv);

    details.append(tasksDiv);
    root.append(details);
  });
  update();
}

function toggleSection(i, checked) {
  const allTasks = [...data[i][1], ...(custom[i] || [])];
  allTasks.forEach((_, j) => { state[i + '-' + j] = checked; });
  save();
  render();
}

function addCustom(i) {
  const inp = document.getElementById('inp-' + i);
  const val = (inp.value || '').trim();
  if (!val) return;
  if (!custom[i]) custom[i] = [];
  custom[i].push(val);
  inp.value = '';
  save();
  render();
}

function deleteCustom(i, customIdx) {
  if (!confirm('למחוק את המשימה?')) return;
  const baseLen = data[i][1].length;
  const remainingChecked = [];
  (custom[i] || []).forEach((t, idx) => {
    if (idx !== customIdx) {
      remainingChecked.push(!!state[i + '-' + (baseLen + idx)]);
    }
  });
  custom[i].splice(customIdx, 1);
  Object.keys(state).forEach(k => {
    if (k.startsWith(i + '-')) {
      const j = parseInt(k.split('-')[1]);
      if (j >= baseLen) delete state[k];
    }
  });
  remainingChecked.forEach((checked, idx) => {
    if (checked) state[i + '-' + (baseLen + idx)] = true;
  });
  save();
  render();
}

function expandAll(open) {
  document.querySelectorAll('details.section').forEach(d => d.open = open);
}

function resetAll() {
  if (confirm('לאפס את כל הסימונים והמשימות האישיות?')) {
    state = {};
    custom = {};
    save();
    render();
  }
}

function share() {
  let txt = '📋 צ׳קליסט הכנות לברית\n\n';
  data.forEach((s, i) => {
    const allTasks = [...s[1], ...(custom[i] || [])];
    txt += '▸ ' + s[0] + '\n';
    allTasks.forEach((t, j) => {
      txt += (state[i + '-' + j] ? '☑ ' : '☐ ') + t + '\n';
    });
    txt += '\n';
  });
  if (navigator.share) {
    navigator.share({title: 'הברית שלנו', text: txt}).catch(() => copyTxt(txt));
  } else {
    copyTxt(txt);
  }
}

function copyTxt(txt) {
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(txt).then(() => alert('הרשימה הועתקה! אפשר להדביק בוואטסאפ')).catch(() => prompt('העתק:', txt));
  } else prompt('העתק:', txt);
}

function printList() {
  window.print();
}

function toggleTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem('bris-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}

function celebrate() {
  const el = document.getElementById('celebrate');
  if (el.dataset.done) return;
  el.dataset.done = '1';
  el.classList.add('show');
  const colors = ['#d6bd74','#1b7259','#123e35','#e8c547','#fff'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.8 + 's';
    c.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    el.append(c);
  }
  setTimeout(() => { el.innerHTML = ''; el.classList.remove('show'); delete el.dataset.done; }, 3500);
}

if (localStorage.getItem('bris-theme') === 'dark') document.body.classList.add('dark');

render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
