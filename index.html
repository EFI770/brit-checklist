<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="הברית שלנו"><meta name="theme-color" content="#123e35"><title>הברית שלנו | צ׳קליסט</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ee;color:#1c302b;font-family:-apple-system,BlinkMacSystemFont,'Arial',sans-serif}header{background:#123e35;color:white;padding:30px 20px 24px;border-radius:0 0 28px 28px}h1{font-size:29px;margin:0 0 6px}header p{margin:0;color:#d5e6de;font-size:14px}.progress{margin-top:22px;display:flex;justify-content:space-between;align-items:center}.percent{font-size:36px;font-weight:800}.bar{height:11px;background:#41665c;border-radius:20px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#d6bd74;width:0;transition:width .25s}main{padding:16px 14px 40px;max-width:700px;margin:auto}.toolbar{display:flex;gap:8px;margin-bottom:14px}button{font:inherit;cursor:pointer}.toolbar button{border:1px solid #cdd8d0;background:white;border-radius:12px;padding:11px;flex:1;color:#123e35}.section{background:white;border:1px solid #e0e6de;border-radius:18px;margin:12px 0;overflow:hidden}.section summary{padding:18px 16px;font-size:17px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center;list-style:none}.section summary::-webkit-details-marker{display:none}.count{font-size:13px;color:#58766a;font-weight:500}.tasks{padding:0 14px 14px}.task{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid #edf0ea;font-size:15px;line-height:1.45}.task input{width:23px;height:23px;flex:none;accent-color:#1b7259;margin:0}.task:has(input:checked) span{text-decoration:line-through;color:#87948c}.notice{padding:14px;background:#fff9e8;border:1px solid #ecdda8;border-radius:15px;line-height:1.6;font-size:14px;margin:18px 0}.footer{text-align:center;color:#6c8075;font-size:12px;padding:12px}</style></head><body><header><h1>הברית שלנו ✨</h1><p>צ׳קליסט הכנות לברית חב״דית</p><div class="progress"><div><div class="percent" id="percent">0%</div><small id="fraction">0 משימות הושלמו</small></div><div style="font-size:44px">✡</div></div><div class="bar"><div class="fill" id="fill"></div></div></header><main><div class="toolbar"><button onclick="resetAll()">איפוס</button><button onclick="share()">שיתוף</button></div><div id="sections"></div><div class="notice">הטיפים והרשימה מבוססים על מנהגי חב״ד וניסיון מעשי. תמיד להתייעץ עם המוהל הרפואי שלכם.</div><div class="footer">שמור את האפליקציה למסך הבית · עובד גם ללא אינטרנט</div></main><script>const data=[['לפני הברית',['בחירת מוהל מוסמך והמלצות','תיאום מועד מדויק עם המוהל','בחירת מקום (בית כנסת / אולם / בית)','הזמנת סנדק','הזמנת אורחים','הזמנת קייטרינג / כיבוד','הזמנת צלם או וידאו','רכישת ציוד לברית (חיתולים, טיטולים, מגבונים, מוצץ)','רכישת יין אדום כשר וגביע','הכנת 2 טליתות (אבא + סנדק)','הכנת כרית לברית','רכישת משחת אלחוש ומשחת ריפוי לפי הנחיית המוהל','הכנת בגדים לתינוק וליולדת','הדפסת הזמנות / תשורות','הכנת כיסא אליהו אם צריך']],['הכנות אחרונות',['וידוא אישור רפואי מהרופא','קביעת לוח זמנים מדויק','הכנת רשימת כיבודים','בדיקת סדר העמודים והכריכה','הזמנת הדפסה וכמות עותקים','איסוף התשורות מבית הדפוס','מינוי אחראי לחלוקת התשורה']],['ביום הברית',['קבלת אישור סופי שהמצב הרפואי מאפשר את הברית','וידוא הגעת המוהל והסנדק','הכנת התינוק לפי הנחיות המוהל','הבאת כל הציוד והיין','סידור כיסא אליהו ומקום הברית','חלוקת הכיבודים','צילום ותיעוד לפי רצון המשפחה','חלוקת התשורות','לימוד והתוועדות בסעודה','קבלת הנחיות כתובות לטיפול לאחר הברית','קביעת ביקורת ומעקב עם המוהל']]];const key='bris-checklist-v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const root=document.getElementById('sections');function save(){localStorage.setItem(key,JSON.stringify(state));update()}function update(){let total=0,done=0;data.forEach((s,i)=>{let count=0;s[1].forEach((t,j)=>{total++;if(state[i+'-'+j]){done++;count++}});document.getElementById('count-'+i).textContent=count+'/'+s[1].length});let p=Math.round(100*done/total);document.getElementById('percent').textContent=p+'%';document.getElementById('fraction').textContent=done+' מתוך '+total+' משימות הושלמו';document.getElementById('fill').style.width=p+'%'}data.forEach((s,i)=>{let details=document.createElement('details');details.className='section';details.open=i===0;let summary=document.createElement('summary');let name=document.createElement('span');name.textContent=(i+1)+'. '+s[0];let count=document.createElement('span');count.className='count';count.id='count-'+i;summary.append(name,count);details.append(summary);let tasks=document.createElement('div');tasks.className='tasks';s[1].forEach((t,j)=>{let label=document.createElement('label');label.className='task';let cb=document.createElement('input');cb.type='checkbox';cb.checked=!!state[i+'-'+j];cb.onchange=()=>{state[i+'-'+j]=cb.checked;save()};let span=document.createElement('span');span.textContent=t;label.append(cb,span);tasks.append(label)});details.append(tasks);root.append(details)});update();function resetAll(){if(confirm('לאפס את כל הסימונים?')){state={};document.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);save()}}function share(){let txt=data.map((s,i)=>s[0]+'\n'+s[1].map((t,j)=>(state[i+'-'+j]?'☑ ':'☐ ')+t).join('\n')).join('\n\n');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(txt).then(()=>alert('הרשימה הועתקה. אפשר להדביק בוואטסאפ.')).catch(()=>prompt('העתק את הרשימה:',txt))}else prompt('העתק את הרשימה:',txt)}if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script></body></html>
