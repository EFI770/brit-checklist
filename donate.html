<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>קישורי תרומה לקהילות - צ׳קליסט לברית חב״דית</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#eaf6f8;color:#17364a;margin:0;padding:18px;direction:rtl}
.card{max-width:700px;margin:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 24px #1a5f7a22}
h1{font-size:24px;margin-top:0}
select,button{display:block;box-sizing:border-box;width:100%;margin-top:14px;padding:14px;border-radius:12px;font:inherit;font-size:17px}
select{border:1px solid #9ab9c7;background:#fff}
button{border:0;background:#1b8a6b;color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#48677a}
#out{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef8f4;border-radius:12px;padding:14px;margin-top:16px;font-size:14px;direction:ltr;text-align:left}
small{display:block;color:#5f7380;line-height:1.6;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h1>קישורי תרומה לקהילות</h1>
<p>בחירת יעד תרומה מתוך הרשימה שאושרה על ידי בעל האתר. לא ניתן להזין כאן כתובת חדשה - הוספת קהילה נעשית רק בקוד האתר, בידי בעל האתר.</p>
<label for="sel">בחר יעד תרומה מאושר</label>
<select id="sel"></select>
<button onclick="make()">צור קישור לצ׳קליסט</button>
<button class="secondary" onclick="copyOut()">העתק את הקישור שנוצר</button>
<div id="out" hidden></div>
<small>הקישור שנוצר מצביע על מזהה ברשימה המאושרת בלבד. שינוי הרשימה אפשרי רק לבעל האתר, ולכן לקוחות לא יכולים לשנות את יעד התרומה.</small>
</div>
<script src="donations.js"></script>
<script>
const base=new URL('./',location.href).href,sel=document.getElementById('sel');
Object.keys(BRIT_DONATIONS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=(k==='default'?'ברירת מחדל':k)+' - '+new URL(BRIT_DONATIONS[k]).hostname;sel.appendChild(o)});
function make(){const k=sel.value,u=BRIT_DONATIONS[k],o=document.getElementById('out');o.hidden=false;const link=k==='default'?base:base+'?c='+encodeURIComponent(k);o.textContent='יעד התרומה: '+new URL(u).hostname+'\n'+link}
async function copyOut(){const o=document.getElementById('out');if(o.hidden)return;try{await navigator.clipboard.writeText(o.textContent)}catch(e){const r=document.createRange();r.selectNodeContents(o);const s=getSelection();s.removeAllRanges();s.addRange(r)}}
</script>
</body>
</html>
